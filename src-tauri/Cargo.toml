[package]
name = "cryptic-realm"
version = "0.9.0"
description = "Cryptic Realm desktop shell"
authors = ["BlizzHacker"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
