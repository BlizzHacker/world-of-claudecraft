[package]
name = "cryptic-realm"
version = "0.24.0-cr.1"
description = "Cryptic Realm desktop shell"
authors = ["BlizzHacker"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

# This is a thin webview shell (opens a window to crypticrealm.com), so runtime
# perf is irrelevant. Use low optimization to keep peak compiler memory small —
# opt-level=3 OOM'd rustc-LLVM on this machine during final codegen.
[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = true
incremental = false
