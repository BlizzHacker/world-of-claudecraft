name: Build Xbox MSIX

# The UWP workload is several GB and is not installed on the dev machine, so the
# packaged console app is built here. Diagnostics run before the build so a
# missing component is identifiable from one failed run rather than three.
#
# This package replaces the 0.23.0.1 hosted web app. That one set Application
# StartPage to https://crypticrealm.com/, which on Xbox runs the legacy EdgeHTML
# engine; EdgeHTML has no WebGL2 and three.js dropped WebGL1 in r163, so it
# installs, launches and renders nothing. This one hosts WebView2 (Chromium).

on:
  workflow_dispatch:
  push:
    paths:
      - 'shell/**'
      - '.github/workflows/xbox-msix.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the prebuilt client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Built where the client actually lives (this branch is far behind it)
          # and published as a release asset. cr-realms is already excluded:
          # every realm body is lazyPreload and fetched on demand, so bundling
          # them would add 2GB for assets an offline session never touches.
          $dest = 'shell\CrypticRealm.Shell\web'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          gh release download client-dist-v0.32.0 -R ${{ github.repository }} `
            -p 'cr-client-dist.tgz' -O client.tgz
          if ($LASTEXITCODE -ne 0) { Write-Error 'client asset download failed'; exit 1 }
          tar -xzf client.tgz -C $dest
          if ($LASTEXITCODE -ne 0) { Write-Error 'client extract failed'; exit 1 }
          $n = (Get-ChildItem $dest -Recurse -File).Count
          $mb = [math]::Round(((Get-ChildItem $dest -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "client staged: $n files, $mb MB"
          # A package that builds without its client installs and shows nothing,
          # which is the hardest failure to diagnose from a console.
          if (-not (Test-Path "$dest\index.html")) { Write-Error 'index.html missing'; exit 1 }
          if ($n -lt 500) { Write-Error "only $n files staged; client looks truncated"; exit 1 }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ip = & $vswhere -products * -format value -property installationPath | Select-Object -First 1
          Write-Host "--- UWP (AppxPackage) targets ---"
          $appx = Join-Path $ip 'MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage'
          if (Test-Path $appx) { Get-ChildItem $appx | Select-Object -First 8 Name }
          else { Write-Host "MISSING: $appx  (UWP workload not present on this image)" }
          Write-Host "--- MSBuild ---"
          msbuild -version

      - name: Restore
        shell: pwsh
        run: |
          msbuild shell\CrypticRealm.Shell.sln /t:Restore `
            /p:Configuration=Release /p:Platform=x64 `
            /p:RestorePackagesConfig=true /v:minimal

      - name: Build MSIX
        shell: pwsh
        run: |
          # StoreAndSideload, not StoreUpload. StoreUpload emits only the
          # .msixupload, whose sideload sibling REFERENCES its framework
          # packages without shipping them. Deploying that to a console
          # installs cleanly and then dies immediately after the splash,
          # because the app cannot start managed code without
          # Microsoft.NET.Native.Runtime and has no XAML without
          # Microsoft.UI.Xaml. Sideload mode emits AppPackages\..._Test\
          # Dependencies\x64\*.appx, which is what a console actually needs.
          msbuild shell\CrypticRealm.Shell\CrypticRealm.Shell.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Never `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=StoreAndSideload `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppInstallerFile=false `
            /v:minimal /consoleloggerparameters:Summary 2>&1 | Tee-Object -FilePath build.log

      - name: Build diagnostic probe (bare UWP, no WebView2)
        shell: pwsh
        run: |
          # Bisect artefact, never shipped. Both real apps die right after the
          # splash on real hardware and neither has ever been seen running, so
          # there is no known-good baseline. This is the same UWP/WinUI 2 host
          # with WebView2 removed entirely: if it launches, WebView2 is the
          # fault; if it dies too, sideloaded UWP itself is broken there.
          msbuild shell\CrypticRealm.Probe\CrypticRealm.Probe.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppInstallerFile=false `
            /v:minimal /consoleloggerparameters:Summary

      - name: Fail if .NET Native has no runtime directives
        shell: pwsh
        run: |
          # ILT0027 means ILC compiled with NO runtime directives, which strips
          # the reflection metadata XAML needs to activate types through COM.
          # That is the exact cause of the NotSupportedException these packages
          # died with on console, and it went unnoticed because it is only a
          # warning. An rd.xml added with the wrong item type (<None> instead of
          # RdXmlFile) is silently ignored, so assert on the compiler output
          # rather than on the file existing.
          $log = Get-Content build.log -Raw -ErrorAction SilentlyContinue
          if ($log -and $log -match 'ILT0027') {
            Write-Error 'ILT0027: runtime directives were not picked up'
            exit 1
          }

      - name: Verify the sideload dependency set was emitted
        shell: pwsh
        run: |
          # Guard the exact failure above: a sideload package with no
          # Dependencies folder is unrunnable on a console and the symptom
          # (splash, then nothing) points nowhere near the real cause.
          $deps = Get-ChildItem -Recurse -Path shell -Filter *.appx -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -like '*Dependencies*' }
          if (-not $deps) { Write-Error 'no framework dependencies emitted'; exit 1 }
          $deps | ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name) }

      - name: Locate output
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem -Recurse -Include *.msix,*.msixupload,*.appx `
            -Path shell -ErrorAction SilentlyContinue
          if (-not $pkgs) { Write-Error "no package produced"; exit 1 }
          $pkgs | ForEach-Object { Write-Host ("{0}  {1:N0} bytes" -f $_.FullName, $_.Length) }

      - name: Validate package contents
        shell: pwsh
        run: |
          # A package that builds but ships no polyfill installs fine and then
          # ignores the controller entirely, which is the hardest possible thing
          # to diagnose from a console. Assert it is inside the package.
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
                 Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } |
                 Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdk.FullName 'x64\makeappx.exe'

          # Scope to the SHELL package: the diagnostic probe is also a
          # sideload _Test msix and would otherwise be validated against the
          # shell's Store identity, which it deliberately does not share.
          $msix = Get-ChildItem -Recurse -Filter *.msix -Path shell\CrypticRealm.Shell |
                  Where-Object { $_.FullName -like '*_Test*' } |
                  Select-Object -First 1
          if (-not $msix) { Write-Error 'no sideload msix to inspect'; exit 1 }

          $dest = Join-Path $env:RUNNER_TEMP 'unpacked'
          & $makeappx unpack /p $msix.FullName /d $dest /nv | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error 'unpack failed'; exit 1 }

          $polyfill = Join-Path $dest 'Assets\gamepad-polyfill.js'
          if (-not (Test-Path $polyfill)) {
            Write-Error 'gamepad-polyfill.js missing: the app would ignore the controller'
            exit 1
          }
          Write-Host ("polyfill present: {0:N0} B" -f (Get-Item $polyfill).Length)

          $index = Join-Path $dest 'web\index.html'
          if (-not (Test-Path $index)) {
            Write-Error 'web/index.html missing: the app would install and render nothing'
            exit 1
          }
          $webCount = (Get-ChildItem (Join-Path $dest 'web') -Recurse -File).Count
          Write-Host ("packaged client: {0:N0} files" -f $webCount)

          [xml]$m = Get-Content (Join-Path $dest 'AppxManifest.xml')
          $id = $m.Package.Identity
          Write-Host ("identity: {0} {1} {2}" -f $id.Name, $id.Version, $id.ProcessorArchitecture)
          # Identity drift means the Store treats this as a different product and
          # the existing submission cannot be updated from it.
          if ($id.Name -ne 'MOVEWEIGHT.CrypticRealm') {
            Write-Error "identity name drifted from Partner Center product 9P34BZH26X6Z"; exit 1
          }
          if ($id.Publisher -ne 'CN=6375D74B-5E4F-45B4-B246-B29507C1332A') {
            Write-Error "publisher drifted from the Partner Center product"; exit 1
          }
          $fams = $m.Package.Dependencies.TargetDeviceFamily | ForEach-Object { $_.Name }
          Write-Host ("device families: " + ($fams -join ', '))
          if ($fams -notcontains 'Windows.Xbox') { Write-Error 'Xbox family missing'; exit 1 }

      - name: Stage each package on its own
        shell: pwsh
        run: |
          # Separate artifacts: the sideload package and the Store package are
          # each ~600MB with the client inside, and a combined artifact could
          # not be downloaded at all.
          New-Item -ItemType Directory -Path out\sideload,out\store -Force | Out-Null
          $side = Get-ChildItem -Recurse -Path shell\CrypticRealm.Shell -Filter *.msix |
                  Where-Object { $_.FullName -like '*_Test*' } | Select-Object -First 1
          $store = Get-ChildItem -Recurse -Path shell\CrypticRealm.Shell -Filter *.msixupload |
                   Select-Object -First 1
          if (-not $side) { Write-Error 'no sideload package'; exit 1 }
          if (-not $store) { Write-Error 'no store package'; exit 1 }
          Copy-Item $side.FullName 'out\sideload\CrypticRealm-Xbox.msix'
          Copy-Item $store.FullName 'out\store\CrypticRealm-Xbox.msixupload'
          Write-Host ("sideload: {0:N0} bytes" -f $side.Length)
          Write-Host ("store:    {0:N0} bytes" -f $store.Length)

      - name: Upload diagnostic probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out\probe -Force | Out-Null
          $pr = Get-ChildItem -Recurse -Path shell\CrypticRealm.Probe -Filter *.msix |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pr) { Write-Error 'no probe package'; exit 1 }
          Copy-Item $pr.FullName 'out\probe\CR-Probe.msix'
          Write-Host ("probe: {0:N0} bytes" -f $pr.Length)
          # Symbols let a console crash dump be mapped to method names offline.
          $sym = Get-ChildItem -Recurse -Path shell\CrypticRealm.Probe -Filter *.appxsym |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($sym) { Copy-Item $sym.FullName 'out\probe\CR-Probe.appxsym' }

      - uses: actions/upload-artifact@v4
        with:
          name: cryptic-realm-xbox-probe
          path: |
            out/probe/*.msix
            out/probe/*.appxsym
          if-no-files-found: error

      - name: Upload sideload package
        uses: actions/upload-artifact@v4
        with:
          name: cryptic-realm-xbox-sideload
          path: out/sideload/*.msix
          if-no-files-found: error

      - name: Upload store package
        uses: actions/upload-artifact@v4
        with:
          name: cryptic-realm-xbox-store
          path: out/store/*.msixupload
          if-no-files-found: error

      - name: Build DEBUG diagnostic package (no packaged client)
        shell: pwsh
        run: |
          # Diagnostics only, and deliberately WITHOUT the 598MB client: the
          # memory failure happens in the web client, so a thin shell pointing
          # at the live site reproduces it exactly while staying small enough
          # to actually transfer and deploy. The full artifact with three
          # ~600MB packages could not be downloaded at all.
          #
          # Debug enables the WebView2 remote-debugging hook (the Xbox Edge
          # browser has no DevTools, so this is the only telemetry available)
          # and is plain IL rather than .NET Native, which independently tests
          # whether .NET Native is what activation is rejecting.
          Remove-Item 'shell\CrypticRealm.Shell\web' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path 'shell\CrypticRealm.Shell\web' | Out-Null
          Set-Content 'shell\CrypticRealm.Shell\web\.keep' ''
          msbuild shell\CrypticRealm.Shell\CrypticRealm.Shell.csproj `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppInstallerFile=false `
            /v:minimal /consoleloggerparameters:Summary
          $dbg = Get-ChildItem -Recurse -Path shell -Filter *.msix |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host ("debug package: {0:N0} bytes  {1}" -f $dbg.Length, $dbg.Name)
          New-Item -ItemType Directory -Path debugout -Force | Out-Null
          Copy-Item $dbg.FullName 'debugout\CrypticRealm-Debug.msix'

      - name: Upload the debug package on its own
        uses: actions/upload-artifact@v4
        with:
          name: cryptic-realm-xbox-debug
          path: debugout/*.msix
          if-no-files-found: error

