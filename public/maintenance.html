<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cryptic Realm — Maintenance</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<meta http-equiv="refresh" content="30" />
<style>
  :root {
    color-scheme: dark;
    --gold: #d7b56d;
    --gold-soft: #f3dfaa;
    --ink: #f7efe0;
    --muted: #c4b899;
    --panel: rgba(10, 13, 20, 0.78);
    --line: rgba(215, 181, 109, 0.38);
    --accent: #d4442a;
    --accent-glow: rgba(212, 68, 42, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: 'Cinzel', 'Palatino Linotype', Palatino, Georgia, serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 50% 5%, rgba(212, 68, 42, 0.18), transparent 60%),
      radial-gradient(ellipse at 50% 95%, rgba(58, 214, 200, 0.10), transparent 65%),
      linear-gradient(180deg, #0a0505 0%, #050202 60%, #000 100%);
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }
  .panel {
    max-width: 560px;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px 32px;
    text-align: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.7);
  }
  .logo {
    width: 96px;
    height: 96px;
    margin: 0 auto 18px;
    border-radius: 16px;
    background: url('/cryptic-realm-logo.png') center/contain no-repeat,
                rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
    letter-spacing: 1.2px;
    color: var(--gold);
    text-shadow: 0 0 18px var(--accent-glow);
  }
  p {
    margin: 6px 0;
    color: var(--muted);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    line-height: 1.55;
  }
  .lede {
    color: var(--ink);
    font-size: 16px;
    margin-top: 14px;
  }
  .spark {
    margin-top: 22px;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1.0; }
  }
  .refresh-hint {
    margin-top: 26px;
    font-size: 12px;
    letter-spacing: 1.2px;
    color: var(--muted);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="logo" role="img" aria-label="Cryptic Realm"></div>
    <h1>The Realm Sleeps</h1>
    <p class="lede">Cryptic Realm is undergoing scheduled maintenance.</p>
    <p>We're pulling the latest code, rebuilding the world, and bringing every realm back online. This page auto-refreshes every 30 seconds — when the realm is back, you'll land on the homepage automatically.</p>
    <div class="spark" aria-hidden="true"></div>
    <p class="refresh-hint">Auto-refreshing every 30 s</p>
  </div>
</body>
</html>
