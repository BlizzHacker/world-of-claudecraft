apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def playIntegrityCloudProjectNumber = providers
    .environmentVariable("PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER")
    .orElse("865860061593")
    .get()
    .trim()

// Release (upload key) signing material. The keystore and its passwords are secrets and
// never live in Git: this reads android/keystore.properties (gitignored, documented in
// docs/RELEASE_KEYSTORE.md) and falls back to CR_UPLOAD_* environment variables so a CI
// runner can inject them instead. When neither source is complete the release build stays
// UNSIGNED rather than failing, so contributors without the upload key can still build.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def uploadSigningValue = { String propertyName, String envName ->
    def value = keystoreProps.getProperty(propertyName) ?: System.getenv(envName)
    return value?.trim() ?: null
}
def uploadStoreFile = uploadSigningValue("storeFile", "CR_UPLOAD_STORE_FILE")
def uploadStorePassword = uploadSigningValue("storePassword", "CR_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = uploadSigningValue("keyAlias", "CR_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = uploadSigningValue("keyPassword", "CR_UPLOAD_KEY_PASSWORD")
def hasUploadKey = uploadStoreFile && uploadStorePassword && uploadKeyAlias &&
    uploadKeyPassword && file(uploadStoreFile).exists()
if (!hasUploadKey) {
    logger.lifecycle("cryptic-realm: no upload key resolved, release artifacts will be UNSIGNED")
}

android {
    namespace = "com.worldofclaudecraft"
    compileSdk = rootProject.ext.compileSdkVersion
    flavorDimensions += "distribution"
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        // The Play listing this fork updates is com.crypticrealm (see the shipped
        // 1.0.3/code 4 bundle and commit fb8a25107). The namespace stays
        // com.worldofclaudecraft because that is where the Java/Kotlin sources and the
        // generated BuildConfig live; applicationId is the Play identity and is
        // deliberately different. Upstream merges keep reverting this line, so a bundle
        // built without it is rejected by Play as the wrong package.
        applicationId "com.crypticrealm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 40
        versionName "0.35.1-cr.1"
        buildConfigField "long", "PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER", "${playIntegrityCloudProjectNumber}L"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    productFlavors {
        play {
            dimension "distribution"
            buildConfigField "String", "SOLANA_MOBILE_DISTRIBUTION", '"google-play"'
        }
        solanaStore {
            dimension "distribution"
            buildConfigField "String", "SOLANA_MOBILE_DISTRIBUTION", '"solana-dapp-store"'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:integrity:1.4.0"
    solanaStoreImplementation("com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.3") {
        exclude group: "androidx.test.ext", module: "junit-ktx"
    }
    solanaStoreImplementation "com.solanamobile:web3-solana:0.2.5"
    solanaStoreImplementation "com.solanamobile:rpc-core:0.2.7"
    solanaStoreImplementation "io.github.funkatronics:multimult:0.2.3"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
